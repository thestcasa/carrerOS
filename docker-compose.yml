services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://career_os:career_os@db:5432/career_os
      REDIS_URL: redis://redis:6379/0
      CANDIDATES_ROOT: /app/candidates
      CANDIDATE_FIXTURES_ROOT: /app/candidate-fixtures
      RUNTIME_ROOT: /app/runtime
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - candidate_data:/app/candidates
      - runtime_data:/app/runtime
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 5s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: career_os
      POSTGRES_USER: career_os
      POSTGRES_PASSWORD: career_os
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_os -d career_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: .
    command: ["sh", "-c", "python -m app inspect-candidate-volume && exec python -m app run-worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://career_os:career_os@db:5432/career_os
      REDIS_URL: redis://redis:6379/0
      CANDIDATES_ROOT: /app/candidates
      CANDIDATE_FIXTURES_ROOT: /app/candidate-fixtures
      RUNTIME_ROOT: /app/runtime
    volumes:
      - candidate_data:/app/candidates
      - runtime_data:/app/runtime
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  browser-worker:
    build: .
    command: ["sh", "-c", "python -m app inspect-candidate-volume && exec python -m app run-browser-worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://career_os:career_os@db:5432/career_os
      REDIS_URL: redis://redis:6379/0
      CANDIDATES_ROOT: /app/candidates
      CANDIDATE_FIXTURES_ROOT: /app/candidate-fixtures
      RUNTIME_ROOT: /app/runtime
    volumes:
      - candidate_data:/app/candidates
      - runtime_data:/app/runtime
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build: .
    command: ["sh", "-c", "python -m app inspect-candidate-volume && exec python -m app run-scheduler"]
    environment:
      DATABASE_URL: postgresql+psycopg://career_os:career_os@db:5432/career_os
      REDIS_URL: redis://redis:6379/0
      CANDIDATES_ROOT: /app/candidates
      CANDIDATE_FIXTURES_ROOT: /app/candidate-fixtures
      RUNTIME_ROOT: /app/runtime
    volumes:
      - candidate_data:/app/candidates
      - runtime_data:/app/runtime
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  candidate_data:
  postgres_data:
  redis_data:
  runtime_data:
